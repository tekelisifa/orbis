name: APK Android

# À chaque mise à jour de main : compile l'APK de test et le publie dans la release « Aperçu ».
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Une seule compilation à la fois : la plus récente remplace celle en attente.
concurrency:
  group: apk
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  android:
    name: Compiler l'APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Préparer Godot et les plugins Android
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ci/prepare_android.sh

      - name: Importer le projet
        run: godot --headless --import --path . || true

      - name: Exporter l'APK
        shell: bash
        run: |
          mkdir -p build
          godot --headless --verbose --path . --install-android-build-template --export-debug "Android" "$PWD/build/orbis.apk" 2>&1 | tail -80
          ls -la build
          test -s build/orbis.apk

      - name: Garder l'APK (onglet Actions)
        uses: actions/upload-artifact@v4
        with:
          name: orbis-apk
          path: build/orbis.apk

      - name: Publier dans la release « Aperçu »
        uses: ncipollo/release-action@v1
        with:
          tag: apercu
          name: Aperçu (dernière version)
          body: |
            APK de test généré automatiquement depuis la branche main (commit ${{ github.sha }}).
            Sur ton téléphone : télécharge orbis.apk, ouvre-le, et autorise l'installation depuis cette source si Android le demande.
          artifacts: build/orbis.apk
          allowUpdates: true
          replacesArtifacts: true
          prerelease: true
          makeLatest: true
          commit: ${{ github.sha }}
