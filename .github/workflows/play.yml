name: Play Store (AAB)

# Compile l'AAB signé pour le Play Store.
# Déclenchement : pousser un tag « v1.0.0 » (ou lancer à la main depuis l'onglet Actions).
# Pubs et achats : voir orbis/monetisation/active dans project.godot.
# Secrets GitHub nécessaires (Settings → Secrets and variables → Actions) :
#   UPLOAD_KEYSTORE_BASE64   la clé d'importation (.keystore) encodée en base64
#   UPLOAD_KEYSTORE_PASSWORD son mot de passe
#   UPLOAD_KEY_ALIAS         son alias
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Numéro de version (ex. 1.0.0)"
        required: false

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"

jobs:
  aab:
    name: Compiler l'AAB
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Vérifier les secrets
        shell: bash
        env:
          KS_B64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::error::Secret UPLOAD_KEYSTORE_BASE64 manquant (voir en haut de ce fichier)"; exit 1; fi

      - name: Préparer Godot, la clé d'importation et les plugins Android
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
        run: ci/prepare_android.sh

      - name: Numéro de version
        shell: bash
        run: |
          # versionCode = numéro de compilation (toujours croissant) ; versionName = tag sans le « v »
          NAME="${{ inputs.version }}"
          [ -n "$NAME" ] || NAME="${GITHUB_REF_NAME#v}"
          case "$NAME" in [0-9]*) ;; *) NAME="0.1.$GITHUB_RUN_NUMBER" ;; esac
          CODE=$((100 + GITHUB_RUN_NUMBER))
          sed -i "s/^version\/code=.*/version\/code=$CODE/; s/^version\/name=.*/version\/name=\"$NAME\"/" export_presets.cfg
          echo "Version $NAME ($CODE)"

      - name: Monétisation (interrupteur orbis/monetisation/active)
        shell: bash
        run: |
          # Écrit une clé dans la section [admob] de project.godot (la crée si besoin).
          admob_set() {
            sed -i "\\|^$1=|d" project.godot
            grep -q '^\[admob\]' project.godot || printf '\n[admob]\n' >> project.godot
            sed -i "/^\[admob\]/a $1=$2" project.godot
          }
          if grep -q '^monetisation/active=true' project.godot; then
            if grep -E '^monetisation/(admob_app_id|rewarded_id|interstitial_id)=' project.godot | grep -q 3940256099942544; then
              echo "::error::Monétisation active mais identifiants AdMob de test : remplace-les dans project.godot"
              exit 1
            fi
            APP="$(grep '^monetisation/admob_app_id=' project.godot | cut -d= -f2-)"
            admob_set general/android/enabled true
            admob_set general/android/app_id "$APP"
            echo "Monétisation ACTIVE (AdMob $APP)"
          else
            admob_set general/android/enabled false
            echo "Monétisation désactivée : AAB sans pubs ni achats"
          fi
          sed -n '/^\[admob\]/,/^\[/p' project.godot

      - name: Importer le projet
        run: godot --headless --import --path . || true

      - name: Exporter l'AAB
        shell: bash
        run: |
          mkdir -p build
          godot --headless --verbose --path . --install-android-build-template --export-release "Android Play" "$PWD/build/orbis.aab" 2>&1 | tail -80
          ls -la build
          test -s build/orbis.aab

      - name: Garder l'AAB (onglet Actions)
        uses: actions/upload-artifact@v4
        with:
          name: orbis-aab
          path: build/orbis.aab

      - name: Joindre l'AAB à la release du tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ncipollo/release-action@v1
        with:
          artifacts: build/orbis.aab
          allowUpdates: true
          generateReleaseNotes: true
